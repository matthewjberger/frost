name: Rust

on:
  push:
    branches: [main]
  pull_request:

# `just ci-linux` runs these same gates in a container, which is the way to see
# them from a machine that is not this one. Three defects sat here red for weeks
# because they cannot happen on Windows and nobody could run this job locally.
env:
  CARGO_TERM_COLOR: always
  # The runner has a C toolchain, and the abort and self-hosting tests need one.
  # Without this they would silently no-op, so a toolchain that went missing
  # would hide behind a green run rather than failing it.
  FROST_REQUIRE_LINKER: "1"
  # The editor drivers need a JavaScript runtime. The runner has one, and
  # without this the editor test would pass by doing nothing.
  FROST_REQUIRE_NODE: "1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --verbose
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --verbose
      # The same suite with every imported module reduced to what its interface
      # says it offers. Separate compilation is only sound if that is
      # sufficient, so it is checked on every commit rather than the day the
      # compiler starts relying on it. See docs/separate-compilation.md.
      - name: Run tests building imports from interfaces
        run: cargo test --verbose
        env:
          FROST_BUILD_FROM_INTERFACES: "1"
